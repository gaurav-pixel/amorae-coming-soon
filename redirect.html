<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You – Amorae</title>
    <style>
        :root {
            --peach: #F7D7C7;
            --coral: #E36C61;
            --text-dark: #5A5757;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--peach);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        .card {
            background: #fff;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 450px;
            width: 90%;
            animation: fadeIn 1.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 32px;
            color: var(--coral);
            margin-bottom: 10px;
            font-weight: 600;
        }

        p {
            color: var(--text-dark);
            font-size: 17px;
            margin-top: 0;
        }

        a {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            background: var(--coral);
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Thank You! 💗</h1>
        <p>You are now subscribed to the Amorae waitlist.<br>We’ll notify you as soon as we launch!</p>
        <a href="index.html">Back to Home</a>
    </div>
</body>
</html>
