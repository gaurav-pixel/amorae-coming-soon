<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You – Amorae</title>
    <style>
        :root {
            --peach: #F7D7C7;
            --coral: #E36C61;
            --text-dark: #5A5757;
            --soft-peach: #fceee7;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--peach);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card {
            background: #fff;
            padding: 45px 35px;
            border-radius: 25px;
            max-width: 430px;
            width: 90%;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.08);
            animation: fadeIn 1.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Soft checkmark animation */
        .checkmark {
            width: 70px;
            height: 70px;
            background: var(--soft-peach);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            animation: pop 0.7s ease;
            box-shadow: 0 4px 15px rgba(227, 108, 97, 0.18);
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .checkmark svg {
            width: 38px;
            height: 38px;
            fill: var(--coral);
        }

        h1 {
            font-size: 28px;
            color: var(--coral);
            margin-bottom: 10px;
        }

        p {
            font-size: 16px;
            color: var(--text-dark);
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* Social buttons */
        .social-box {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-box a {
            width: 48px;
            height: 48px;
            background: var(--soft-peach);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 8px rgba(227, 108, 97, 0.20);
            transition: 0.25s ease;
        }

        .social-box a:hover {
            transform: translateY(-3px);
            background: #ffe3da;
        }

        .social-box svg {
            width: 24px;
            height: 24px;
            fill: var(--coral);
        }

        .home-btn {
            margin-top: 30px;
            display: inline-block;
            padding: 12px 26px;
            background: var(--coral);
            color: #fff;
            border-radius: 40px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 3px 10px rgba(227, 108, 97, 0.3);
            transition: 0.25s;
        }

        .home-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="checkmark">
            <svg viewBox="0 0 24 24">
                <path d="M9 16.2l-3.5-3.5-1.4 1.4L9 19 20 8l-1.4-1.4z"/>
            </svg>
        </div>

        <h1>You're In! 🎉</h1>
        <p>Thank you for subscribing. You'll be the first to know when Amorae goes live.</p>

        <div class="social-box">
            <!-- Instagram -->
            <a href="https://www.instagram.com/amoraecare/" target="_blank">
                <svg viewBox="0 0 24 24">
                    <path d="M7 2C4.2 2 2 4.2 2 7v10c0 2.8 2.2 5 5 5h10c2.8 0 5-2.2 5-5V7c0-2.8-2.2-5-5-5H7zm10 2c1.7 0 3 1.3 3 3v10c0 1.7-1.3 3-3 3H7c-1.7 0-3-1.3-3-3V7c0-1.7 1.3-3 3-3h10zm-5 3.3A4.7 4.7 0 0 0 7.3 12 4.7 4.7 0 0 0 12 16.7 4.7 4.7 0 0 0 16.7 12 4.7 4.7 0 0 0 12 7.3zm0 2A2.7 2.7 0 0 1 14.7 12 2.7 2.7 0 0 1 12 14.7 2.7 2.7 0 0 1 9.3 12 2.7 2.7 0 0 1 12 9.3zm4.8-3.6a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2z"/>
                </svg>
            </a>

            <!-- Email -->
            <a href="mailto:weareamorae@gmail.com">
                <svg viewBox="0 0 24 24">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm0 4v10h16V8l-8 5-8-5zm16-4H4l8 5 8-5z"/>
                </svg>
            </a>
        </div>

        <a class="home-btn" href="index.html">Back to Home</a>
    </div>
</body>
</html>
