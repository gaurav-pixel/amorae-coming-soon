<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amorae – Coming Soon</title>
    <style>
        :root {
            --peach: #F7D7C7;
            --coral: #E36C61;
            --text-dark: #5A5757;
            --soft-peach: #fceee7;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--peach);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        .card {
            background: #fff;
            padding: 50px 40px;
            border-radius: 25px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.08);
            max-width: 450px;
            width: 90%;
            animation: fadeIn 1.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        img {
            width: 140px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 32px;
            color: var(--coral);
            margin-bottom: 8px;
            font-weight: 600;
        }

        p {
            color: var(--text-dark);
            font-size: 17px;
            margin-top: 0;
        }

        /* Pinterest Aesthetic Notify Box */
        .notify-box {
            margin-top: 25px;
            background: var(--soft-peach);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(227, 108, 97, 0.15);
            animation: softPop 0.8s ease;
        }

        @keyframes softPop {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        input[type="email"] {
            width: 80%;
            padding: 14px;
            border-radius: 40px;
            border: 1px solid #ffd2c5;
            background: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.25s ease;
        }

        input[type="email"]:focus {
            border-color: var(--coral);
            box-shadow: 0 0 8px rgba(227, 108, 97, 0.25);
        }

        button {
            width: 85%;
            padding: 14px;
            border: none;
            background-color: var(--coral);
            color: white;
            font-size: 16px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.25s ease;
            margin-top: 10px;
            box-shadow: 0 3px 10px rgba(227, 108, 97, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .tagline {
            margin-top: 18px;
            font-size: 14px;
            color: var(--coral);
            font-weight: 500;
        }

        footer {
            margin-top: 30px;
            font-size: 13px;
            color: #8a8a8a;
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="logo.png" alt="Amorae Logo" />
        <h1>We're Building Something Beautiful</h1>
        <p>Our website is currently under construction. Stay tuned for a fresh and delightful experience crafted just for you.</p>

        <div class="notify-box">
            <form action="https://formsubmit.co/weareamorae@gmail.com" method="POST">
                
                <!-- Disable CAPTCHA -->
                <input type="hidden" name="_captcha" value="false">

                <!-- ✅ Redirect to your redirect.html inside same folder -->
                <input type="hidden" name="_next" value="https://amorae.co.in/redirect.html">

                <input type="email" name="email" placeholder="Enter your email" required />
                <button type="submit">Notify Me</button>
            </form>
        </div>

        <div class="tagline">Affordable, Adorable & Absolutely Yours.</div>
    </div>

    <footer>© 2025 Amorae. All rights reserved.</footer>
</body>
</html>
